# Builds Talk-To-AI.dmg on GitHub's Apple Silicon Macs.
#
# - Push a tag like v1.1.0 → the .dmg is attached to a GitHub Release.
# - Or run it by hand from the Actions tab → download the .dmg from the run.

name: Build macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the Release

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build app and .dmg
        run: bash build_app.sh

      - name: Upload .dmg to this run
        uses: actions/upload-artifact@v4
        with:
          name: Talk-To-AI-dmg
          path: dist/*.dmg

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Take the section for this version, e.g. "## v1.1.0 — ..." up to the next "## "
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { if (found) exit; if (index($0, "## " tag " ") == 1 || $0 == "## " tag) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See CHANGELOG.md for details." > release_notes.md
          fi
          cat release_notes.md

      - name: Attach .dmg to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body_path: release_notes.md

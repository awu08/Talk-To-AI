# Builds Talk-To-AI.dmg on GitHub's Apple Silicon Macs.
#
# - Push a tag like v1.1.0 → the .dmg is attached to a GitHub Release.
# - Or run it by hand from the Actions tab → download the .dmg from the run.

name: Build macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the Release

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build app and .dmg
        run: bash build_app.sh

      - name: Upload .dmg to this run
        uses: actions/upload-artifact@v4
        with:
          name: Talk-To-AI-dmg
          path: dist/*.dmg

      - name: Attach .dmg to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
